name: ROS 2 Jazzy CI

on:
  push:
  pull_request:

jobs:
  deterministic-checks:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy
    env:
      ROS_DISTRO: jazzy
      ROS_LOG_DIR: /tmp/mobile_base_ci_logs
    steps:
      - uses: actions/checkout@v4

      - name: Install declared dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y

      - name: Create isolated workspace
        run: |
          mkdir -p /tmp/mobile_base_ws/src
          ln -s "$GITHUB_WORKSPACE" /tmp/mobile_base_ws/src/rev_mobile_base

      - name: Build packages
        working-directory: /tmp/mobile_base_ws
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select \
            rev_base_description rev_base_gazebo rev_base_tools rev_base_bringup

      # CI runs the safety chain and Nav2 sims only; run the rest locally (GUIDE.md).
      - name: Run deterministic package tests
        working-directory: /tmp/mobile_base_ws
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+ --packages-select \
            rev_base_description rev_base_gazebo rev_base_tools rev_base_bringup \
            --ctest-args -E 'test_test_(sensor_topics|bug_nav|camera_floor)\.py'
          colcon test-result --verbose

      - name: Validate Python and URDF
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 -m compileall -q \
            rev_base_description rev_base_gazebo rev_base_tools rev_base_bringup
          xacro rev_base_description/urdf/mobile_base.urdf.xacro \
            > /tmp/mobile_base.urdf
          check_urdf /tmp/mobile_base.urdf
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --check
